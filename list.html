<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Nested List Example</title>
</head>
<body>

    <!-- Main Unordered List -->
    <ul>
        <li>Fruit
            <!-- Nested Ordered List -->
            <ol>
                <li>Bananas</li>
                <li>Apples
                    <!-- Deeply Nested Square Bullet List -->
                    <ul style="list-style-type: square;">
                        <li>Green</li>
                        <li>Red</li>
                    </ul>
                </li>
                <li>Pears</li>
            </ol>
        </li>
        <li>Vegetables</li>
        <li>Meat</li>
    </ul>

</body>
</html>
