<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CSS Types Demonstration</title>

    <!-- External CSS -->
    <link rel="stylesheet" href="style.css">

    <!-- Internal CSS -->
    <style>
        .internal {
            background-color: lightgreen;
            color: darkgreen;
            padding: 15px;
            border: 2px solid green;
        }
    </style>
</head>

<body>

    <h1>Demonstration of Different Types of CSS</h1>

    <!-- Inline CSS -->
    <p style="background-color: lightblue; color: blue; padding: 15px;">
        This paragraph uses Inline CSS.
    </p>

    <!-- Internal CSS -->
    <p class="internal">
        This paragraph uses Internal CSS.
    </p>

    <!-- External CSS -->
    <p class="external">
        This paragraph uses External CSS.
    </p>

    <!-- Imported CSS -->
    <p class="imported">
        This paragraph uses Imported CSS.
    </p>

</body>
</html>
